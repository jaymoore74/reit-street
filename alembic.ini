# Alembic config. The database URL is NOT here: it comes from config.ini or
# REITSTREET_DB_* environment variables (see migrations/env.py).
[alembic]
script_location = %(here)s/src/reitstreet/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
