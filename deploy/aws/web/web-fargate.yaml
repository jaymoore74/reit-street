AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  REIT Street client website, hosting option A (ADR 0013): ECS Fargate (ARM) behind an
  Application Load Balancer with an ACM certificate, in the Aurora VPC. Creates nothing
  until someone deploys this stack. The service starts at 0 tasks, so the stack can be
  created before the first image is pushed.

Parameters:
  EnvName:
    Type: String
    AllowedValues: [staging, production]
    Default: staging
    Description: staging is the test site; production is the business site later.
  DomainName:
    Type: String
    Default: research.jwalteranalytics.com
    AllowedPattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
    Description: The site's address, the one place the domain is set. The certificate is issued for it.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The Aurora cluster's VPC.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more public subnets in different Availability Zones (route to an igw-).
  DbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: The Aurora cluster's security group. The stack adds one inbound rule (3306 from the site only).
  DbSecretArn:
    Type: String
    AllowedPattern: "^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:reitstreet/db/web-[A-Za-z0-9]{6}$"
    Description: Full ARN of the reitstreet/db/web secret made by ops-bootstrap-db (ends in -xxxxxx).
  WarehouseSchema:
    Type: String
    Default: reitstreet
  AppSchema:
    Type: String
    Default: reitstreet_app
  ImageTag:
    Type: String
    Default: none
    AllowedPattern: "^[A-Za-z0-9._-]{1,128}$"
    Description: Tag pushed by the ops-web-image workflow (the commit SHA). Change it to deploy.
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 4
    Description: Running copies. 0 until an image exists; 1 to serve; 2 for deploys with no downtime.
  EmailProvider:
    Type: String
    AllowedValues: [none, ses]
    Default: none
    Description: none prints links for staff to send; ses sends them (needs a verified domain in SES).
  EmailFrom:
    Type: String
    Default: ""
    Description: Sender address on an SES-verified domain, e.g. research@jwalteranalytics.com. Required for ses.
  SiteName:
    Type: String
    Default: REIT Street
    Description: Shown in page titles and emails. Placeholder until the business name is set.
  SampleData:
    Type: String
    AllowedValues: ["0", "1"]
    Default: "1"
    Description: 1 shows a sample-data banner on every page. Set 0 only for real client data.

Conditions:
  UseSes: !Equals [!Ref EmailProvider, ses]
  HasEmailFrom: !Not [!Equals [!Ref EmailFrom, ""]]

Rules:
  SesNeedsSender:
    RuleCondition: !Equals [!Ref EmailProvider, ses]
    Assertions:
      - Assert: !Not [!Equals [!Ref EmailFrom, ""]]
        AssertDescription: EmailFrom is required when EmailProvider is ses.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub reitstreet-web-${EnvName}
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"keep the last 30 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},
          "action":{"type":"expire"}}]}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /reitstreet/web/${EnvName}
      RetentionInDays: 90

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub reitstreet-web-${EnvName}
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  # pulls the image, writes logs and reads the database secret at task start
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-web-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbSecretArn

  # what the running site may call in AWS: only SES, only from EmailFrom, only when ses is on
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies: !If
        - UseSes
        - - PolicyName: send-site-email
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: ses:SendEmail
                  Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
                  Condition:
                    StringEquals:
                      ses:FromAddress: !Ref EmailFrom
        - !Ref AWS::NoValue

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: REIT Street website load balancer, HTTP and HTTPS from anywhere
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: "HTTP, redirected to HTTPS" }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: REIT Street website task, port 3000 from the load balancer only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: from the load balancer

  DbIngressFromSite:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroupId
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      Description: !Sub REIT Street website ${EnvName}

  # DNS validation: the stack waits here until the CNAME shown in the ACM console (and in
  # the stack's Events tab) is added at the domain's DNS host. See docs/runbooks/web-hosting.md.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub reitstreet-web-${EnvName}
      Scheme: internet-facing
      Type: application
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: idle_timeout.timeout_seconds, Value: "120" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub reitstreet-web-${EnvName}
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Sub ${Repository.RepositoryUri}:${ImageTag}
          Essential: true
          PortMappings: [{ ContainerPort: 3000, Protocol: tcp }]
          Environment:
            - { Name: RS_DB_WAREHOUSE, Value: !Ref WarehouseSchema }
            - { Name: RS_DB_APP, Value: !Ref AppSchema }
            - { Name: RS_PUBLIC_BASE_URL, Value: !Sub "https://${DomainName}" }
            - { Name: RS_TRUSTED_PROXY_HOPS, Value: "1" }
            - { Name: RS_SAMPLE_DATA, Value: !Ref SampleData }
            - { Name: RS_SITE_NAME, Value: !Ref SiteName }
            - { Name: RS_EMAIL_PROVIDER, Value: !Ref EmailProvider }
            - !If [HasEmailFrom, { Name: RS_EMAIL_FROM, Value: !Ref EmailFrom }, !Ref AWS::NoValue]
            - { Name: RS_AWS_REGION, Value: !Ref AWS::Region }
          Secrets:
            - { Name: RS_DB_HOST, ValueFrom: !Sub "${DbSecretArn}:host::" }
            - { Name: RS_DB_PORT, ValueFrom: !Sub "${DbSecretArn}:port::" }
            - { Name: RS_DB_USER, ValueFrom: !Sub "${DbSecretArn}:username::" }
            - { Name: RS_DB_PASSWORD, ValueFrom: !Sub "${DbSecretArn}:password::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: web
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          # a public IP instead of a NAT gateway; only the load balancer can reach port 3000
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  SiteUrl:
    Value: !Sub https://${DomainName}
  DnsRecord:
    Description: Add this record at the domain's DNS host once the stack is created.
    Value: !Sub "CNAME  ${DomainName}  ->  ${LoadBalancer.DNSName}"
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  LogGroup:
    Value: !Ref LogGroup
