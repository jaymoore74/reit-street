[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reitstreet"
version = "0.2.0"
description = "REIT data platform: SEC EDGAR and supplemental ingestion, lineage-tracked MySQL warehouse, client delivery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "PyMySQL>=1.1,<2",
  "cryptography>=42",        # MySQL 8 caching_sha2_password auth
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyMySQL",
  "types-requests",
]

[project.scripts]
reitstreet = "reitstreet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reitstreet = ["reference/data/*.csv", "py.typed", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
  "S101",   # assert in tests
  "S608",   # SQL built from whitelisted identifiers only; values are always bound
  "S310",   # urlopen not used with user schemes
  "RUF001", "RUF002", "RUF003",
  "SIM105",
  "B905",
]

[tool.ruff.lint.per-file-ignores]
"src/reitstreet/migrations/**" = ["E501"]
"tests/**" = ["S101", "S105", "S106", "S311", "S608"]

[tool.mypy]
python_version = "3.11"
files = ["src/reitstreet"]
exclude = ["src/reitstreet/migrations/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["mysql: needs a MySQL 8 server (set REITSTREET_TEST_DB_URL)"]
