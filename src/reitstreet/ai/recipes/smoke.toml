# A 15-minute check that the whole loop works (data -> train -> adapter -> serve -> eval)
# before spending hours on extract-qa. Runs on a 64 GB Mac. The adapter is not for use.
name = "smoke"
model = "qwen3.8-27b-4bit"
dataset = "current"

[train]
fine_tune_type = "lora"
num_layers = 4
batch_size = 1
iters = 50
learning_rate = 1e-5
max_seq_length = 4096
grad_checkpoint = true
mask_prompt = true
steps_per_report = 5
steps_per_eval = 25
val_batches = 5
save_every = 50
seed = 20261126

[lora]
rank = 8
scale = 20.0
dropout = 0.0

[env]
MLX_DISABLE_COMPILE = "1"
