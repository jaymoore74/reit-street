; REIT Street configuration.
; Copy to config.ini in the repo root (config.ini is git-ignored) and edit.
; Any key can be overridden by an environment variable REITSTREET_<SECTION>_<KEY>,
; e.g. REITSTREET_DB_PASSWORD. Put secrets in environment variables, not in this file.
; Relative paths are relative to the folder that holds config.ini.

[sec]
; REQUIRED. SEC blocks anonymous traffic. Put your own name and email here, e.g.
;   user_agent = Jane Smith jane@yourfirm.com
; The pipeline refuses to call SEC while this placeholder is in place.
user_agent = YOUR NAME your.email@example.com
; SEC's fair-access limit is 10 requests per second. Values above 10 are capped.
requests_per_second = 8
; download 8-K EX-99 exhibits (earnings releases and filed supplementals)
download_exhibits = true

[db]
host = 127.0.0.1
port = 3306
user = reit
name = reitstreet
; schema of the client website (accounts, entitlements, research, audit); ADR 0013
app_name = reitstreet_app
; password: set REITSTREET_DB_PASSWORD instead of writing it here
password =
; TLS: path to the server's CA bundle. Required for Amazon Aurora / RDS (global-bundle.pem).
; When set, the connection is encrypted and the certificate and host name are verified.
; ssl_ca = C:/certs/global-bundle.pem
; or a full SQLAlchemy URL, which overrides the parts above (keep it in an env var)
; url = mysql+pymysql://reit:secret@127.0.0.1:3306/reitstreet?charset=utf8mb4

[paths]
; raw store, logs and exports live here. Back this folder up together with the database.
data_dir = data
; raw_dir = D:/reitstreet-raw
; the REIT universe file maintained next to this repo
universe_csv = ../universe/reits.csv

[http]
; non-SEC sources (REIT IR websites). Blank user_agent sends the generic
;   ReitStreetBot/<version> (REIT disclosure research; honors robots.txt)
; Set your own only if a site asks for a contact; never commit personal details here.
user_agent =
requests_per_second = 1

[ir]
; IR website fetcher (reitstreet fetch-ir). Limits are per host; a longer robots.txt
; Crawl-delay wins (capped at 30 s).
requests_per_second = 0.5
; doc kinds to download: supplemental, earnings_release, presentation, exhibit_other, unknown.
; Every link found is recorded in stg_ir_link either way.
download_kinds = supplemental
; new files per company per run; the rest wait for the next run (--backfill lifts the cap)
max_new_docs_per_company = 40
robots_ttl_hours = 24
; render script-built pages (Q4 and others) in Chromium. Needs:
;   pip install -c constraints.txt -e .[headless]
;   python -m playwright install chromium
headless = false
; days after the expected date before a missing supplemental is flagged overdue
supplemental_grace_days = 7
; a results page that listed at least this many supplementals and now lists none is a layout break
layout_break_min_links = 3
; alert after this many failed checks in a row for one page or PDF URL
alert_after_failures = 3

; [q4_feed]
; Q4-hosted IR sites expose a JSON feed that needs a per-site key. Q4 says use of its API
; needs permission; only add a key you are allowed to use. Prefer environment variables:
;   setx REITSTREET_Q4_FEED_PLD "<key>"
; pld = <key>

[alerts]
; Alerts are always written to ops_alert. Email and webhook are optional extra channels.
smtp_host =
smtp_port = 587
smtp_user =
; smtp_password: set REITSTREET_ALERTS_SMTP_PASSWORD
smtp_password =
from =
to =
; Slack or Teams incoming webhook: set REITSTREET_ALERTS_WEBHOOK_URL
webhook_url =
; info | warn | error | critical
min_severity = warn

[monitor]
; alert when no successful sec-sync for this many hours
max_hours_since_sync = 30
; a running job whose heartbeat is older than this is marked aborted
stale_heartbeat_minutes = 30

[logging]
; json for scheduled runs (one JSON object per line in data/logs), text for humans
format = json
level = INFO
