; REIT Street on a Mac: MySQL on this machine and a local model. Used when REITSTREET_PROFILE=local.
; scripts/mac/setup.sh copies this to config.local.ini (git-ignored) and fills in [sec] user_agent.
; Passwords are not here: setup.sh keeps them in the login keychain and scripts/mac/common.sh
; exports them as REITSTREET_DB_PASSWORD and REITSTREET_AI_DB_URL for each job.
; Relative paths are relative to the folder that holds this file (the repo root).

[sec]
; REQUIRED: your own name and email. SEC blocks anonymous traffic.
user_agent = YOUR NAME your.email@example.com
requests_per_second = 8
download_exhibits = true

[db]
host = 127.0.0.1
port = 3306
user = reit
name = reitstreet

[paths]
; raw store, logs, exports, backups, model datasets and runs. Keep it on the internal SSD
; (or a fast external one) and in Time Machine.
data_dir = data
universe_csv = universe/reits.csv

[http]
user_agent =
requests_per_second = 1

[ir]
requests_per_second = 0.5
download_kinds = supplemental
; Q4-built IR pages need headless Chromium: pip install -e .[headless] && python -m playwright install chromium
headless = false

[alerts]
min_severity = warn

[logging]
format = json
level = INFO

[llm]
; mlx: mlx_lm.server (default port 8080). ollama: Ollama (port 11434). openai_compat: llama.cpp llama-server.
backend = mlx
; blank = the backend's default on 127.0.0.1
base_url =
; mlx: the model `reitstreet-ai serve` loads (a key from `reitstreet-ai models`, a folder or a repo id).
; ollama: the model name each request asks for, as `ollama list` shows it.
model = qwen3.8-27b-8bit
temperature = 0
max_tokens = 4096
timeout_seconds = 600
; keep false: prompts contain warehouse data and must not leave this machine
allow_remote = false

[ai]
; datasets, training runs and evaluation reports (default data/ai)
; dir = data/ai
