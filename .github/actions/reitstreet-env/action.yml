name: reitstreet environment
description: >
  On the AWS runner: install the package into a fresh venv and export REITSTREET_* settings.
  Database credentials come from AWS Secrets Manager (reitstreet/db/<role>) through the
  runner's instance role. Nothing secret is stored in GitHub or printed in the log.
inputs:
  role:
    description: database login to use (migrator, loader or reader)
    required: true
  aws-region:
    description: AWS region of the cluster and secrets
    required: true
  sec-user-agent:
    description: >
      SEC User-Agent, a real name and email. Blank uses the project contact,
      "Jason Moore reits@jwalteranalytics.com"; the repository variable REITSTREET_SEC_USER_AGENT overrides it.
    required: false
    default: ""
  extras:
    description: optional package extras to install, e.g. headless
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install reitstreet
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        spec="."
        if [ -n "$EXTRAS" ]; then spec=".[$EXTRAS]"; fi
        "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check -c constraints.txt "$spec"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        if [[ ",$EXTRAS," == *",headless,"* ]]; then
          # Browser binaries persist on the runner disk; a no-op when already present.
          export PLAYWRIGHT_BROWSERS_PATH=/srv/reitstreet/pw-browsers
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/venv/bin/python" -m playwright install chromium
        fi
    - name: Settings and ${{ inputs.role }} database login
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
        AWS_REGION: ${{ inputs.aws-region }}
        SEC_UA: ${{ inputs.sec-user-agent }}
        SEC_UA_DEFAULT: Jason Moore reits@jwalteranalytics.com
      run: |
        set -euo pipefail
        if [ -z "$AWS_REGION" ]; then echo "::error::Set the repository variable AWS_REGION (docs/runbooks/cloud-setup.md)"; exit 2; fi
        case "$ROLE" in migrator|loader|reader) ;; *) echo "unknown role $ROLE"; exit 2;; esac
        secret=$(aws secretsmanager get-secret-value --region "$AWS_REGION" --secret-id "reitstreet/db/$ROLE" \
                   --query SecretString --output text)
        pw=$(jq -r .password <<<"$secret")
        echo "::add-mask::$pw"
        {
          echo "AWS_REGION=$AWS_REGION"
          echo "REITSTREET_DB_HOST=$(jq -r .host <<<"$secret")"
          echo "REITSTREET_DB_PORT=$(jq -r '.port // 3306' <<<"$secret")"
          echo "REITSTREET_DB_NAME=$(jq -r '.dbname // "reitstreet"' <<<"$secret")"
          echo "REITSTREET_DB_USER=$(jq -r .username <<<"$secret")"
          echo "REITSTREET_DB_PASSWORD=$pw"
          echo "REITSTREET_DB_SSL_CA=/etc/reitstreet/rds-global-bundle.pem"
          echo "REITSTREET_DATA_DIR=/srv/reitstreet/data"
          echo "REITSTREET_RAW_DIR=/srv/reitstreet/data/raw"
          echo "REITSTREET_UNIVERSE_CSV=$GITHUB_WORKSPACE/universe/reits.csv"
          echo "REITSTREET_LOGGING_FORMAT=text"
          echo "REITSTREET_SEC_USER_AGENT=${SEC_UA:-$SEC_UA_DEFAULT}"
        } >> "$GITHUB_ENV"
        unset secret pw
