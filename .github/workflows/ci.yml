name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: tester
          MYSQL_PASSWORD: testpw
          MYSQL_DATABASE: rs_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      REITSTREET_TEST_DB_URL: mysql+pymysql://tester:testpw@127.0.0.1:3306/rs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      # the test user drops and recreates rs_test, so it needs rights on that database name
      - run: mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL ON rs_test.* TO 'tester'@'%'; FLUSH PRIVILEGES;"
      - run: python -m pytest -q -p no:logging
